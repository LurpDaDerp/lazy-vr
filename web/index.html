<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gaze360</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="view"></canvas>
<video id="video" src="/video" playsinline crossorigin="anonymous"></video>

<div id="hud">
  <div class="panel" id="readout">
    <div class="row"><span class="key">state</span><span class="val" id="state">starting</span></div>
    <div class="row"><span class="key">heading</span><span class="val" id="heading">0&deg;</span></div>
    <div class="row"><span class="key">gaze</span><span class="val" id="gaze">0.0, 0.0</span></div>
    <div class="row"><span class="key">pan</span><span class="val" id="rate">0 &deg;/s</span></div>
    <div class="row"><span class="key">tracker</span><span class="val" id="perf">-</span></div>
  </div>

  <div class="panel" id="stickpanel">
    <canvas id="stick" width="150" height="150"></canvas>
  </div>

  <div class="panel" id="campanel">
    <img id="preview" src="/preview.mjpg" alt="webcam">
  </div>
</div>

<div id="compass"><div id="compassmarks"></div><div id="compassneedle"></div></div>

<div id="keys">
  <span><b>C</b> recalibrate</span>
  <span><b>Space</b> play/pause</span>
  <span><b>F</b> fullscreen</span>
  <span><b>H</b> hide overlay</span>
  <span><b>&larr; &rarr;</b> seek</span>
</div>

<div id="overlay">
  <div id="overlaybox">
    <h1>gaze<span>360</span></h1>
    <p id="overlaytext">Look around the video with your eyes.<br>Sit where your webcam can see you, then begin.</p>
    <button id="begin">Begin</button>
    <div id="progresswrap"><div id="progress"></div></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
